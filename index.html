<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ананасовый улун — ароматизированный китайский чай"
    />
    <title>Ананасовый улун — Teaboom</title>
  </head>

  <body>
    <main class="page">
      <article class="product">
        <div class="product__image">
          <img src="/product.webp" alt="Ананасовый улун" />
        </div>

        <div class="product__content">
          <p class="product__category">Ароматизированный</p>

          <h1 class="product__title">Ананасовый улун</h1>

          <div class="product__packages">
            <p class="product__label">Фасовка</p>

            <div class="product__package-list">
              <button
                type="button"
                class="product__package is-active"
                data-package="100"
              >
                100 г
              </button>

              <button type="button" class="product__package" data-package="500">
                500 г
              </button>

              <button
                type="button"
                class="product__package"
                data-package="1000"
              >
                1000 г
              </button>

              <button
                type="button"
                class="product__package"
                data-package="5000"
              >
                5000 г
              </button>
            </div>
          </div>

          <p class="product__article">
            Арт. <span id="product-article">01306</span>
          </p>

          <div class="product__price">
            <del id="product-old-price">349,20 ₽</del>
            <strong id="product-price">326,40 ₽</strong>
          </div>

          <button type="button" class="product__cart">В корзину</button>

          <section class="product__description">
            <h2>О товаре</h2>

            <p>
              Состав: китайский бирюзовый чай, цукаты, натуральные ароматические
              масла.
            </p>

            <p>Светлый Фуцзяньский улун с ароматом ананаса.</p>
          </section>
        </div>
      </article>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
